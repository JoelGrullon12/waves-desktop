# electron-builder packaging config.
#
# electronDist is the critical setting: this project uses the Castlabs ECS
# fork of Electron (github:castlabs/electron-releases#v44.1.0+wvcus) to get
# Widevine CDM bundled in the binary. Without electronDist, electron-builder
# resolves the binary from the standard Electron releases on
# github.com/electron/electron and 404s on the `+wvcus` version string.
# Pointing it at a local dist makes packaging copy the fork binary instead of
# downloading anything.
#
# The value below is only the default: `npm run package:<linux|win>` goes
# through scripts/packageApp.mjs, which downloads the Castlabs build of the
# TARGET platform and overrides it with `-c.electronDist=...`, so either
# platform can be packaged from either machine (the Windows nsis installer and
# its VMP signature still need Windows, or Wine on Linux).

appId: com.personal.waves-desktop
productName: Waves Desktop
electronDist: node_modules/electron/dist
directories:
  output: dist
files:
  - out/**
# VMP signature for Widevine on Windows: without it TIDAL refuses the license
# (ACCESS_DENIED, PlaybackError S6007). Does nothing for Linux targets.
afterSign: ./scripts/vmpSign.mjs

win:
  target:
    - nsis
  icon: resources/icon.ico

linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  maintainer: Waves Desktop <waves-desktop@localhost>
  category: Audio
  executableArgs:
    - --no-sandbox
    - --in-process-gpu
    - --no-zygote